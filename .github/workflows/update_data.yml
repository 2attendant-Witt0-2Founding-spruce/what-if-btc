name: Update Historical Data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci # 'npm ci' is preferred in CI/CD environments for consistent installs

      # Coin Metrics community API needs no key, so no secret is wired in here.
      # The script exits non-zero if the series goes stale, which fails the job
      # loudly instead of letting the site quietly serve frozen prices.
      - name: Run data processing script
        run: node ./.scripts/process-data.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update historical price data"
          file_pattern: "dates/history-*.csv dates/history-*.json"